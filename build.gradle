buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
        google()
        maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    }
}

allprojects {
    apply plugin: 'eclipse'
    apply plugin: 'idea'

    // Настройки IntelliJ IDEA
    idea {
        module {
            outputDir = file('build/classes/java/main')
            testOutputDir = file('build/classes/java/test')
        }
    }
}

configure(subprojects) {
    apply plugin: 'java-library'

    java.sourceCompatibility = 21
    java.targetCompatibility = 21

    // One owner for the shared manifest, including parallel module builds.
    tasks.register('generateAssetList') {
        dependsOn rootProject.tasks.named('generateAssetList')
    }
    tasks.named('processResources') {
        dependsOn rootProject.tasks.named('generateAssetList')
    }

    compileJava {
        options.incremental = true
    }
}

subprojects {
    version = "$projectVersion"
    ext.appName = 'FinalAnswer'

    repositories {
        mavenCentral()
        mavenLocal()
        maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
        maven { url = 'https://jitpack.io' }
    }
}

eclipse.project.name = 'FinalAnswer' + '-parent'
apply from: "gradle/runtime-textures.gradle"

// Never mutate assets while Gradle is configuring or listing tasks.
tasks.register('generateAssetList') {
    group = 'build'
    description = 'Generate a deterministic shared asset manifest when resources change.'
    dependsOn 'prepareRuntimeTextures'
    def assetsDirectory = layout.projectDirectory.dir('assets')
    def manifest = assetsDirectory.file('assets.txt')
    def resources = fileTree(assetsDirectory) { exclude 'assets.txt' }
    inputs.files(resources).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(manifest)
    doLast {
        def base = assetsDirectory.asFile.toPath()
        def entries = resources.files.collect {
            base.relativize(it.toPath()).toString().replace('\\', '/')
        }.sort()
        manifest.asFile.setText(entries.join('\n') + (entries.empty ? '' : '\n'), 'UTF-8')
    }
}

tasks.register('checkProjectLayout', Exec) {
    group = 'verification'
    description = 'Check original asset integrity, source catalogue and documentation links (Python 3 required).'
    workingDir rootDir
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python3'),
        'tools/checks/check_project_layout.py'
}

tasks.register('verifyProject') {
    group = 'verification'
    description = 'Run layout validation, Java regression checks and desktop assembly.'
    dependsOn 'checkProjectLayout', ':server:check', ':core:check', ':shared:check', ':lwjgl3:assemble'
}

tasks.register('checkDesktopDistribution', Exec) {
    group = 'verification'
    description = 'Verify archive completeness and runtime replacement integrity (Python 3).'
    dependsOn ':lwjgl3:jar'
    workingDir rootDir
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python3'),
        'tools/checks/check_runtime_distribution.py'
}
tasks.named('verifyProject') { dependsOn tasks.named('checkDesktopDistribution') }

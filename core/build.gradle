[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

eclipse.project.name = appName + '-core'

dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

    if (enableGraalNative == 'true') {
        implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.register('roundCheck', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.erni.finalanswer.gameplay.RoundCheck'
}

tasks.register('clockCheck', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.erni.finalanswer.gameplay.ClockCheck'
}

dependencies { api project(':shared') }

// Like inspector, these checks are dependency-free executables rather than JUnit suites.
test { failOnNoDiscoveredTests = false }
check.dependsOn roundCheck, clockCheck

tasks.register('presentationCheck', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.erni.finalanswer.presentation.PresentationCheck'
}
check.dependsOn presentationCheck

dependencies { api 'com.google.zxing:core:3.5.4' }

tasks.register('cageCheck', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.erni.finalanswer.lobby.CageCheck'
}
check.dependsOn tasks.named('cageCheck')

tasks.register('ghostCheck', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.erni.finalanswer.lobby.GhostCheck'
}
check.dependsOn tasks.named('ghostCheck')

// Keep the supplied zombie artwork in place; expose unchanged originals as classpath assets.
processResources {
    from(rootProject.projectDir) { include 'zombie1.png', 'zombie2.png', 'zombie3.png', 'zombie4.png', 'zombie5.png', 'zombie6.png' }
}

tasks.register('zombieCheck', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.erni.finalanswer.lobby.ZombieCheck'
}
check.dependsOn tasks.named('zombieCheck')

// Package the seven supplied Dracula PNGs under their original names, leaving sources untouched.
processResources {
    from(rootProject.projectDir) { include 'drakula.png', 'drakula2.png', 'drakula3.png', 'drakula5.png', 'drakula6.png', 'drakula7.png', 'drakula8.png' }
}

tasks.register('draculaCheck', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.erni.finalanswer.lobby.DraculaCheck'
}
check.dependsOn tasks.named('draculaCheck')

tasks.register('pumpkinCheck', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.erni.finalanswer.lobby.PumpkinCheck'
}
check.dependsOn tasks.named('pumpkinCheck')

// Exact approved Plague Doctor source list; no wildcard asset discovery at runtime or packaging.
processResources {
    from(rootProject.projectDir) {
        include 'doktor1.png', 'doktor_body.png', 'left_hand_doktor.png', 'doktor4.png', 'doktor5.png', 'doktor6.png', 'doktor7.png', 'doktor8.png', 'doktor9.png'
    }
}

tasks.register('plagueDoctorCheck', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.erni.finalanswer.lobby.PlagueDoctorCheck'
}
check.dependsOn tasks.named('plagueDoctorCheck')

tasks.register('voodooCheck', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.erni.finalanswer.lobby.VoodooCheck'
    args rootProject.file('assets/lobby/characters/voodoo/voodoo_config.json').absolutePath
}
check.dependsOn tasks.named('voodooCheck')

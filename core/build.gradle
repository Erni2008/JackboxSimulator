[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

eclipse.project.name = appName + '-core'

dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

    if (enableGraalNative == 'true') {
        implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.register('roundCheck', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.erni.finalanswer.gameplay.RoundCheck'
}

tasks.register('clockCheck', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.erni.finalanswer.gameplay.ClockCheck'
}

dependencies { api project(':shared') }

// Like inspector, these checks are dependency-free executables rather than JUnit suites.
test { failOnNoDiscoveredTests = false }
check.dependsOn roundCheck, clockCheck

tasks.register('presentationCheck', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.erni.finalanswer.presentation.PresentationCheck'
}
check.dependsOn presentationCheck

dependencies { api 'com.google.zxing:core:3.5.4' }

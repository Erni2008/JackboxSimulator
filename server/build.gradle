plugins {
    id 'application'
}

application {
    mainClass = 'com.finalanswer.server.RoomServer'
}

dependencies {
    implementation project(':shared')
    implementation 'io.javalin:javalin:7.2.3'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
processResources {
    from(rootProject.file('web')) { into 'web' }
    from(rootProject.file('assets/ui/fonts')) {
        include 'Creepster-Regular.ttf', 'Creepster-OFL.txt', 'NotoSans-Regular.ttf', 'NotoSans-LICENSE.txt', 'RubikWetPaint-Regular.ttf', 'RubikWetPaint-OFL.txt'
        into 'web/fonts'
    }
}
processResources {
    from(rootProject.file('assets/ui/Final_Answer.png')) { into 'web/images' }
}

// Isolated local browser QA. No fixture code or start endpoint enters the production application.
tasks.register('suspicionBrowserFixture', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.finalanswer.server.SuspicionBrowserFixture'
    systemProperty 'suspicion.fixture.dir', layout.buildDirectory.dir('suspicion-browser').get().asFile.absolutePath
}

// Real existing server/controller, explicit test roster and local-file control only.
tasks.register('impostorBrowserFixture', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.finalanswer.server.ImpostorBrowserFixture'
    systemProperty 'impostor.fixture.host', providers.gradleProperty('impostorFixtureHost').getOrElse('127.0.0.1')
    systemProperty 'impostor.fixture.manualClock', providers.gradleProperty('impostorManualClock').getOrElse('false')
    systemProperty 'impostor.fixture.dir', layout.buildDirectory.dir('impostor-browser').get().asFile.absolutePath
}

// Public artwork allowlist stays identical. Ship prepared display copies at the same URLs.
// Character assignments, private assets and arbitrary filesystem routes remain inaccessible.
def publicArt = [
    'ui/buttons/player_count/*.png', 'ui/windows/create_room/field*.png',
    'ui/windows/generation_code/CodeField.png', 'impostor/backgrounds/background1.png',
    'impostor/papers/suspect_papper.png', 'impostor/papers/papper_player_front.png',
    'impostor/portraits/impostor_avatar_frame.png', 'impostor/voting/suspect_print.png',
    'impostor/clock/clockmini.png', 'impostor/clock/arrow_clock1.png',
    'ui/fonts/RoadRage-Regular.ttf', 'ui/fonts/RoadRage-OFL.txt',
    'ui/fonts/Caveat-Variable.ttf', 'ui/fonts/Caveat-OFL.txt',
    'impostor/phone/papper3dview.png', 'impostor/phone/pen.png', 'impostor/phone/word_reminise.png',
    'cursed_boxes/phone/crate-intact.png', 'cursed_boxes/phone/crate-destroyed.png'
]
processResources {
    dependsOn rootProject.tasks.named('prepareRuntimeTextures')
    from(rootProject.file('assets')) {
        include publicArt
        exclude { entry -> new File(rootProject.file('assets/runtime'), entry.relativePath.pathString).isFile() }
        into 'web/art'
    }
    from(rootProject.file('assets/runtime')) {
        include publicArt
        into 'web/art'
    }
}

# THINK OR DIE inside the main match: one round, points are souls.
# Override any key with -Dthinkordie.integrated.<key>=<value>.
integrated=true
rounds=1
# logo 2 s; the rules card adds 5 s the first time the challenge appears in a match
introMs=2000
rulesMs=5000
categoryMs=3000
answerMs=25000
graceMs=400
# checking starts during the round; after the timer it waits at least this long and at most the maximum
validationMinMs=300
validationMaxMs=6000
voteMs=10000
maxDisputes=6
revealBaseMs=6000
revealPerAnswerMs=0
revealMaxMs=6000
# souls phase: counters roll up next to the characters, then the match continues
roundResultsMs=3000
finalMs=0
# souls for a correct answer given by 1 / 2 / 3 / 4+ players; a wrong answer or a personal repeat
pointsUnique=200
pointsTwo=100
pointsThree=25
pointsCrowd=0
pointsMany=25
pointsInvalid=0
voteRejectPenalty=0
# a ghost returns with this many correct answers in the round, none shared with anybody
resurrectMinAnswers=5
rewardFirst=0
rewardSecond=0
rewardThird=0
maxAnswersPerRound=60
minSubmitIntervalMs=250
hiddenAnswers=true
# the phone shows the corrected spelling at once
hideVerdicts=false
# wrong answers and repeats are refused at once (never counted); a typo is corrected and accepted at once
rejectWrong=true
votes=false
# match schedule: a challenge follows every Nth classic question (never after the last one); 0 turns it off
everyQuestions=2

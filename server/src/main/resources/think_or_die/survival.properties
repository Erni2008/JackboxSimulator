# THINK OR DIE survival (standalone mode): one player at a time, a shrinking turn clock, lives
lives=3
introMs=5000
categoryMs=2800
# 7 s for the first answer of a category, 0.4 s less after every accepted answer, never under 3 s; a new category starts at 7 s again
turnStartMs=7000
turnStepMs=400
turnMinMs=3000
# the clock stops while the AI judge decides (at most this long); an undecided answer is refused, never counted
checkMaxMs=2500
resultMs=1100
# a category lasts until a turn runs out of time, then the lap is finished and a new one comes; this is only a cap
lapsPerCategory=6
pointsCorrect=100
finalMs=14000
minSubmitIntervalMs=250
# 1 on 1 and 2 on 2 knockout: lives per side in one duel, the bracket card, the versus card, the duel result
duelLives=2
bracketMs=4500
matchIntroMs=3000
matchResultMs=3500
# after 14 minutes of play: sudden death, every turn is 3 s and any lost life knocks the player out (keeps a game under 20 minutes)
suddenDeathMs=840000

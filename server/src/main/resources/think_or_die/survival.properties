# THINK OR DIE survival (standalone mode): one player at a time, a shrinking turn clock, lives
lives=3
introMs=7000
categoryMs=3800
# 10 s for the first answer of a category, half a second less after every accepted answer, never under 4 s; a new category starts at 10 s again
turnStartMs=10000
turnStepMs=500
turnMinMs=4000
# the clock stops while the AI judge decides (at most this long); an undecided answer is refused, never counted
checkMaxMs=2500
resultMs=1800
# a category lasts until a turn runs out of time, then the lap is finished and a new one comes; this is only a cap
lapsPerCategory=6
pointsCorrect=100
finalMs=14000
minSubmitIntervalMs=250
# 1 on 1 and 2 on 2 knockout: lives per side in one duel, the bracket card, the versus card, the duel result
duelLives=2
bracketMs=6000
matchIntroMs=4000
matchResultMs=4500

# Where the release build hosts rooms. Empty = the game runs its own local server (phones on the same Wi-Fi).
# Near release set it to the cloud server, e.g.  server.url=https://play.example.com
# Players then join from anywhere at that address; if it is unreachable the game falls back to its local server.
# Overrides for testing: -Dfinalanswer.server=URL / FINALANSWER_SERVER_URL, -Dfinalanswer.hosting=local|external
server.url=
fallback.local=true

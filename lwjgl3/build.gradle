// Standalone dev launch after one compilation; repeated previews need no Gradle daemon.
tasks.register('prepareImpostorPreviewLaunch') {
    group = 'application'
    dependsOn devClasses, sourceSets.dev.runtimeClasspath
    def destination=layout.buildDirectory.file('dev-launch/impostor-preview.args')
    outputs.file(destination)
    outputs.upToDateWhen { false }
    doLast {
        def quote={ String value -> '"'+value.replace('\\','\\\\').replace('"','\\"')+'"' }
        def args=['--enable-native-access=ALL-UNNAMED']
        if(os.contains('mac'))args.add('-XstartOnFirstThread')
        args.addAll(['-cp',sourceSets.dev.runtimeClasspath.asPath,'com.erni.finalanswer.lwjgl3.ImpostorPreviewLauncher'])
        def file=destination.get().asFile;file.parentFile.mkdirs();file.text=args.collect(quote).join('\n')+'\n'
    }
}

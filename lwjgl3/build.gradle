    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.erni.finalanswer.lwjgl3.SettingsCheck'
    workingDir = rootProject.file('assets')
    systemProperty 'settings.qa.dir', settingsCheckPreferences.get().asFile.absolutePath
    if (os.contains('mac')) jvmArgs '-XstartOnFirstThread'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
tasks.register('settingsCheck', JavaExec) {
    group = 'verification'
    description = 'Checks language, saving, display rollback and a fresh application restart.'
    dependsOn settingsCheckWrite
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.erni.finalanswer.lwjgl3.SettingsCheck'
    workingDir = rootProject.file('assets')
    systemProperty 'settings.qa.dir', settingsCheckPreferences.get().asFile.absolutePath
    systemProperty 'settings.qa.reload', 'true'
    if (os.contains('mac')) jvmArgs '-XstartOnFirstThread'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}


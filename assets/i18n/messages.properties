mode.standard.name=STANDARD
mode.standard.description=Players answer trivia questions. Incorrect answers send players into deadly mini-games. Eliminated players become ghosts but can continue participating. The last surviving player wins the final escape challenge.

mode.deadline.name=DEADLINE
mode.deadline.description=A faster version of Standard: shorter answer timers, fewer questions, faster mini-games and a shorter overall game.

mode.every_man_for_himself.name=EVERY MAN FOR HIMSELF
mode.every_man_for_himself.description=Compete individually for survival. No alliances or teamwork. Sabotage opponents during certain challenges. Every decision affects your survival, and only one player can win.

mode.trust_no_one.name=TRUST NO ONE
mode.trust_no_one.description=Form temporary alliances, pursue secret objectives and survive betrayal. Players may deceive or sacrifice each other. Choose carefully who to trust.

mode.house_rules.name=HOUSE RULES
mode.house_rules.description=Expect random round modifiers and unexpected host challenges. Timers and mini-game conditions can change. Ghosts may occasionally interfere with living players.


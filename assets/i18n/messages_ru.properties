mode.standard.name=СТАНДАРТНЫЙ
mode.standard.description=Игроки отвечают на вопросы викторины. Неправильные ответы отправляют игроков в смертельные мини-игры. Выбывшие становятся призраками, но продолжают участвовать. Последний выживший побеждает в финальном испытании на побег.

mode.deadline.name=ДЕДЛАЙН
mode.deadline.description=Ускоренная версия стандартного режима: меньше времени на ответы, меньше вопросов, более быстрые мини-игры и короткая игровая сессия.

mode.every_man_for_himself.name=КАЖДЫЙ САМ ЗА СЕБЯ
mode.every_man_for_himself.description=Каждый борется за собственное выживание. Никаких союзов и командной работы. В некоторых испытаниях можно мешать соперникам. Каждое решение влияет на личное выживание. Победитель только один.

mode.trust_no_one.name=НИКОМУ НЕ ВЕРЬ
mode.trust_no_one.description=Временные союзы, тайные цели и предательства. Игроки могут обманывать друг друга или приносить других в жертву. Выбирай, кому доверять.

mode.house_rules.name=ПРАВИЛА ДОМА
mode.house_rules.description=Случайные модификаторы раундов и неожиданные испытания от ведущего. Время на ответы и условия мини-игр могут меняться. Призраки иногда вмешиваются в игру живых.

ui.close=ЗАКРЫТЬ

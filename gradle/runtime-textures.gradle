import java.awt.RenderingHints
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

// Original artwork remains untouched. This task runs only when its inputs change.
def artwork = fileTree('assets') {
    include 'ui/**/*.png', 'models/candle/frames/*.png'
}
def runtimeDirectory = layout.projectDirectory.dir('assets/runtime')
tasks.register('prepareRuntimeTextures') {
    inputs.files(artwork)
    inputs.property('texturePipelineVersion', 1)
    outputs.dir(runtimeDirectory)
    doLast {
        def manifest = new Properties()
        artwork.files.sort().each { source ->
            def relative = file('assets').toPath().relativize(source.toPath()).toString().replace('\\', '/')
            int limit = 1024
            if (relative.startsWith('models/candle/frames/')) limit = 256
            else if (relative.startsWith('ui/buttons/player_count/')) limit = 384
            else if (relative.startsWith('ui/buttons/game_mode/next/') || relative.startsWith('ui/buttons/game_mode/previous/')) limit = 256
            else if (relative.startsWith('ui/buttons/game_mode/info/')) limit = 512
            else if (relative.startsWith('ui/buttons/reroll/')) limit = 256
            else if (relative.startsWith('ui/buttons/back/')) limit = 640
            else if (relative.startsWith('ui/windows/')) limit = 1400
            else if (relative == 'ui/Final_Answer.png') limit = 1536
            def original = ImageIO.read(source)
            if (original == null) throw new GradleException("Cannot decode ${source}")
            if (original.width > limit) {
                int height = Math.max(1, Math.round(original.height * limit / (float) original.width))
                def resized = new BufferedImage(limit, height, BufferedImage.TYPE_INT_ARGB)
                def graphics = resized.createGraphics()
                try {
                    graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
                    graphics.drawImage(original, 0, 0, limit, height, null)
                } finally { graphics.dispose() }
                def output = runtimeDirectory.file(relative).asFile
                output.parentFile.mkdirs()
                if (!ImageIO.write(resized, 'png', output)) throw new GradleException("Cannot write ${output}")
                manifest.setProperty(relative, "${original.width},${original.height}")
                resized.flush()
            }
            original.flush()
        }
        runtimeDirectory.asFile.mkdirs()
        runtimeDirectory.file('sizes.properties').asFile.withOutputStream {
            manifest.store(it, 'Original dimensions for cropped runtime textures')
        }
        logger.lifecycle("Prepared ${manifest.size()} display-sized textures; original artwork preserved.")
    }
}
project(':core') {
    tasks.named('compileJava') { dependsOn rootProject.tasks.named('prepareRuntimeTextures') }
}
project(':lwjgl3') {
    tasks.named('processResources') { dependsOn rootProject.tasks.named('prepareRuntimeTextures') }
}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0506">
  <title>Rare Minds — Host monitor</title>
  <link rel="stylesheet" href="/rare-minds-monitor/monitor.css?v=1">
  <script src="/rare-minds-monitor/monitor.js?v=2" defer></script>
</head>
<body>
  <header class="mon-top">
    <div><p class="mon-brand">RARE MINDS</p><p class="mon-private" id="mon-private">PRIVATE HOST VIEW · DO NOT SHOW ON STREAM</p></div>
    <div class="mon-q"><p id="mon-qno"></p><p id="mon-question"></p></div>
    <div class="mon-clock" id="mon-clock">—</div>
  </header>
  <p class="mon-status" id="mon-status" role="status" aria-live="polite"></p>
  <main class="mon-grid" id="mon-grid"></main>
  <section class="mon-reveal" id="mon-reveal" hidden></section>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Адская клетка · Final Answer</title>
<link rel="stylesheet" href="style.css?v=60">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Final Answer">
<meta name="theme-color" content="#0e0b09">
</head>
<body>
<div id="viewport"></div>
<div id="grade"></div><div id="grain"></div>
<div id="hint"></div>
<div id="page-label"></div>
<div id="task"></div>
<div id="clock"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" class="track"/><circle id="clock-ring" cx="32" cy="32" r="28" class="ring"/></svg><span id="clock-num">60</span></div>
<div id="blast" aria-hidden="true"></div>
<div id="surge-tag" role="status"><i></i><b data-ru="СКАЧОК ДАВЛЕНИЯ" data-en="PRESSURE SURGE">СКАЧОК ДАВЛЕНИЯ</b><span data-ru="+10 PSI НАДВИГАЕТСЯ" data-en="+10 PSI INCOMING">СКАЧОК ДАВЛЕНИЯ +10</span></div>
<div id="fall" role="status"><i></i><b data-ru="АВАРИЙНЫЙ СПУСК" data-en="EMERGENCY DESCENT">АВАРИЙНЫЙ СПУСК</b><span data-ru="▼ ТОРМОЗ СОРВАН" data-en="▼ BRAKE FAILED">▼ ТОРМОЗ СОРВАН</span></div>
<div id="hgt" hidden></div>
<div id="shift" hidden><b id="shift-t"></b><span id="shift-s"></span></div>
<div id="verdict" role="status" aria-live="assertive"><i></i><b></b><span></span></div>
<button id="btn-sound" data-ru="Звук: вкл." data-en="Sound: on">Звук: вкл.</button>
<button id="btn-cam" data-ru="Камера: игрок" data-en="Camera: player">Камера: игрок</button>
<button id="btn-room" hidden data-ru="‹ В комнату" data-en="‹ Back to room">‹ В комнату</button>
<div id="bar">
  <button id="btn-prev" hidden>‹ Page</button>
  <button id="btn-open" hidden data-ru="Открыть" data-en="Open">Открыть</button>
  <button id="btn-close" hidden data-ru="Закрыть" data-en="Close">Закрыть</button>
  <button id="btn-lower" hidden data-ru="Опустить" data-en="Lower">Опустить</button>
  <button id="btn-drop" hidden data-ru="Бросить" data-en="Drop">Бросить</button>
  <button id="btn-sheet" hidden data-ru="Вернуть листок" data-en="Pin it back">Вернуть листок</button>
  <button id="btn-back" hidden data-ru="Назад" data-en="Back">Назад</button>
  <button id="btn-next" hidden>Page ›</button>
</div>
<div id="loading"><span id="load-text"></span></div>
<script type="module" src="app.js?v=60"></script>
</body>
</html>

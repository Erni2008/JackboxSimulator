<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Engineer's Manual</title>
<link rel="stylesheet" href="style.css?v=24">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<div id="viewport"></div>
<div id="grade"></div><div id="grain"></div>

<div id="task">ЗАДАНИЕ 1 / 12</div>

  <button id="btn-close" hidden>Закрыть</button>
  <button id="btn-lower" hidden>Опустить</button>
  <button id="btn-drop" hidden>Бросить</button>
  <button id="btn-back" hidden>Назад</button>
  <button id="btn-next" hidden>Page ›</button>
</div>
<div id="loading"><span id="load-text">Спуск…</span></div>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111"><title>ПРОКЛЯТЫЙ ЗАБЕГ — FINAL ANSWER</title><link rel="stylesheet" href="./style.css"></head><body>
<div id="stage"></div>
<section id="intro" hidden><div class="intro-top"><b>ПРОКЛЯТЫЙ ЗАБЕГ</b><span>ПРАВИЛА</span></div><p id="intro-sub"></p><div class="intro-line"><i id="intro-bar"></i></div><button id="intro-skip">ПРОПУСТИТЬ ›</button></section>
<section id="tap" hidden><button>НАЖМИТЕ, ЧТОБЫ НАЧАТЬ</button></section>
<section id="pick"><h1>ПРОКЛЯТЫЙ ЗАБЕГ</h1><div id="maps"><button data-map="1"><b>Ущелье заката</b><span>карта 1</span></button><button data-map="2"><b>Проклятое кладбище</b><span>карта 2</span></button><button data-map="3"><b>Дом коллекционера</b><span>карта 3</span></button><button data-map="4"><b>Катакомбы</b><span>карта 4</span></button></div><p>Выберите персонажа</p><div id="roster"></div></section>
<section id="loading" hidden><h2>Загрузка трассы…</h2><div class="load"><i id="load-fill"></i></div></section>
<div id="hud"><div id="top"><div id="timer">2:30</div><div id="track"><b id="fill"></b><em class="flag">🏁</em></div></div><div id="place"><small>МЕСТО</small><span id="place-n">1</span><span id="place-of">/6</span></div><ol id="board"></ol><div id="count"></div><div id="toast"></div><div id="flash"></div><button id="mute" aria-label="Звук">🔊</button>
<div id="stick-zone"></div><div id="stick"><i id="knob"></i></div><button id="jump" aria-label="Прыжок">⤒</button>
<section id="results" hidden><h2 id="verdict">ФИНИШ!</h2><div class="podium"></div><ol></ol><button id="again">ЕЩЁ РАЗ</button></section></div>
<script type="module" src="./app.js"></script></body></html>

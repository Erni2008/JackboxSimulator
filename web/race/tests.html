<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Испытания — тест</title>
<style>body{margin:0;background:#120d0b;color:#f3e9d6;font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;padding:16px}h1{font:700 26px Georgia,serif;color:#f6dfb0}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}a{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid #6b4a2b;border-radius:10px;color:inherit;text-decoration:none;background:#1d1411}
a:hover{border-color:#f6c26b}b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#7a1a12;color:#fff}.n{color:#f6c26b;font-size:11px;margin-left:auto}
select{background:#1d1411;color:inherit;border:1px solid #6b4a2b;border-radius:8px;padding:6px;margin:0 0 12px}</style></head><body>
<h1>Тест испытаний по одному</h1><label>Карта (оформление): <select id="m"><option value="1">1 Ущелье</option><option value="2">2 Кладбище</option><option value="3">3 Дом</option><option value="4">4 Катакомбы</option></select></label>
<div class="g" id="g"></div><script>
const T=[['spinner','Мельница'],['gauntlet','Мясорубка'],['highlow','Верх-низ'],['gaps','Провалы'],['beams','Узкие балки'],['pendulums','Маятники'],['rafts','Плоты'],['crumble','Обвал пола'],['sink','Трясина'],['pushers','Тараны'],['pads','Батуты'],['traps','Люки'],['conveyor','Транспортёр'],['flames','Огненный пол'],['hammers','Молоты'],['zigzag','Змейка'],['ramp','Скат с бочками'],['rain','Дождь с неба'],['maze','Лабиринт'],['fakewalls','Ложные стены'],['portals','Порталы'],['gears','Гигантские шестерни','new'],['gates','Смертельные ворота','new'],['wind','Ветряной коридор','new'],['chase','Катящийся валун','new'],['tilt','Переворачивающаяся комната','new'],['hooks','Крюки','new'],['falsebridge','Ложный мост','new'],['minecarts','Безумные вагонетки','new']];
const m=document.getElementById('m'),g=document.getElementById('g');function draw(){g.innerHTML=T.map(([k,n,x],i)=>`<a href="./?char=pumpkin&map=${m.value}&t=${i+1}"><b>${i+1}</b>${n}${x?'<span class=n>НОВОЕ</span>':''}</a>`).join('')}m.onchange=draw;draw();
</script></body></html>
